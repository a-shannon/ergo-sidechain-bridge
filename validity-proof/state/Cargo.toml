[package]
name = "bridge-validity-state-proof"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake2.workspace = true
bridge-validity-statement = { path = "../statement", default-features = false, optional = true }
hash-db.workspace = true
hash256-std-hasher.workspace = true
memory-db.workspace = true
scale-codec.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
trie-db.workspace = true

[dev-dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-state-machine = { workspace = true, features = ["std"] }
sp-trie = { workspace = true, features = ["std"] }

[features]
default = ["std", "application-v2", "pooled-reserve-burn-v4", "pooled-reserve-burn-v5"]
application-v2 = []
pooled-reserve-burn-v4 = [
    "dep:bridge-validity-statement",
    "dep:sha2",
    "bridge-validity-statement/pooled-reserve-burn-v4",
]
pooled-reserve-burn-v5 = [
    "pooled-reserve-burn-v4",
    "bridge-validity-statement/pooled-reserve-burn-v5",
]
std = [
    "blake2/std",
    "bridge-validity-statement?/std",
    "hash-db/std",
    "memory-db/std",
    "scale-codec/std",
    "sha2?/std",
    "trie-db/std",
]
