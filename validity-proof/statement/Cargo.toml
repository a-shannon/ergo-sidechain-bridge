[package]
name = "bridge-validity-statement"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake2.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[features]
default = ["std", "application-v2", "pooled-reserve-burn-v4", "pooled-reserve-burn-v5"]
application-v2 = []
pooled-reserve-burn-v4 = []
pooled-reserve-burn-v5 = ["pooled-reserve-burn-v4"]
substrate-federated-v1 = []
std = ["blake2/std"]
