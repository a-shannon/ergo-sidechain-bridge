[package]
name = "bridge-validity-finality-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake2.workspace = true
ed25519-zebra.workspace = true
finality-grandpa.workspace = true
num-traits.workspace = true
scale-codec.workspace = true
# Keep the derive crate in lockstep with codec; newer derive internals are incompatible with 3.6.12.
parity-scale-codec-derive.workspace = true
thiserror.workspace = true

[dev-dependencies]
sp-consensus-grandpa = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
    "ed25519-zebra/std",
    "finality-grandpa/std",
    "scale-codec/std",
]
