[workspace]
members = ["composition", "core", "state", "statement"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
blake2 = { version = "=0.10.6", default-features = false }
ed25519-zebra = { version = "=4.2.0", default-features = false }
finality-grandpa = { version = "=0.16.2", default-features = false, features = ["derive-codec"] }
hash-db = { version = "=0.16.0", default-features = false }
hash256-std-hasher = { version = "=0.15.2", default-features = false }
memory-db = { version = "=0.32.0", default-features = false }
num-traits = { version = "=0.2.19", default-features = false }
scale-codec = { package = "parity-scale-codec", version = "=3.6.12", default-features = false, features = ["derive"] }
parity-scale-codec-derive = "=3.6.12"
sha2 = { version = "=0.10.9", default-features = false }
sp-consensus-grandpa = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2412-6", default-features = false }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2412-6", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2412-6", default-features = false }
sp-state-machine = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2412-6", default-features = false }
sp-trie = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2412-6", default-features = false }
thiserror = { version = "=2.0.12", default-features = false }
trie-db = { version = "=0.29.2", default-features = false }
