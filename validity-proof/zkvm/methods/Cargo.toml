[package]
name = "bridge-validity-zkvm-methods"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
risc0-build = { git = "https://github.com/risc0/risc0", rev = "8eb06ab020a92dc5b63ba6dd0836d432aba6d890", default-features = false }

[dev-dependencies]
risc0-binfmt = { git = "https://github.com/risc0/risc0", rev = "8eb06ab020a92dc5b63ba6dd0836d432aba6d890" }
sha2 = "=0.10.9"

# This workspace is built only in the pinned Linux environment. Keep metadata
# resolution possible on Windows without making Windows a supported proof host.
[target.'cfg(windows)'.build-dependencies]
risc0-zkvm-platform = { git = "https://github.com/risc0/risc0", rev = "8eb06ab020a92dc5b63ba6dd0836d432aba6d890", default-features = false, features = ["export-syscalls"] }

[package.metadata.risc0]
# V1, V2, and V4 are frozen ProgramBinaries under artifacts/. Building their
# historical entrypoints against current crates would change their image IDs.
methods = ["guest-v5"]
