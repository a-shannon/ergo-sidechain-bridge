name: Bridge V1 checks

on:
  pull_request:
    paths:
      - ".github/workflows/v1-bridge-checks.yml"
      - ".github/workflows/relayer-checks.yml"
      - "README.md"
      - "SECURITY.md"
      - ".dockerignore"
      - "v1/**"
      - "wasm-avl/**"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/v1-bridge-checks.yml"
      - ".github/workflows/relayer-checks.yml"
      - "README.md"
      - "SECURITY.md"
      - ".dockerignore"
      - "v1/**"
      - "wasm-avl/**"

permissions:
  contents: read

jobs:
  solidity-v1:
    name: V1 Solidity closure & audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v1/solidity/package-lock.json

      - name: Install V1 Solidity dependencies
        working-directory: v1/solidity
        run: npm ci --ignore-scripts --include=dev

      - name: Verify reproducible V1 Solidity build closure
        working-directory: v1/solidity
        run: node compile.js check

      - name: Install Foundry toolchain (forge)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Foundry stateless fuzzing & stateful invariant suite
        working-directory: v1/solidity
        run: forge test -vv

      - name: Audit V1 Solidity dependencies
        working-directory: v1/solidity
        run: npm audit --audit-level=high --include=dev

  v1-contracts-and-relayer:
    name: V1 WASM AVL + SigmaState 6.0.2 JVM matrix + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v1/package-lock.json

      - name: Setup Java 17 (Maven cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned wasm-pack v0.14.0 (SHA-256 verified)
        run: |
          set -euo pipefail
          TOOL_DIR="${RUNNER_TEMP}/wasm-pack-0.14.0"
          mkdir -p "${TOOL_DIR}"
          ARCHIVE="${TOOL_DIR}/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.14.0/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz" \
            -o "${ARCHIVE}"
          echo "278a8d668085821f4d1a637bd864f1713f872b0ae3a118c77562a308c0abfe8d  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" -C "${TOOL_DIR}"
          echo "${TOOL_DIR}/wasm-pack-v0.14.0-x86_64-unknown-linux-musl" >> "${GITHUB_PATH}"

      - name: Test and build WASM AVL prover
        working-directory: wasm-avl
        run: |
          cargo test --locked
          wasm-pack build --target nodejs --out-dir pkg

      - name: Fetch SigmaState 6.0.2 JVM runtime JARs
        run: >-
          mvn -B -f v1/jvm/pom.xml dependency:copy-dependencies
          -DoutputDirectory="${{ github.workspace }}/v1/jvm/target/dependency"

      - name: Install V1 dependencies
        working-directory: v1
        run: npm ci

      - name: Audit V1 dependencies
        working-directory: v1
        run: npm audit --audit-level=high --include=dev

      - name: Typecheck V1 TypeScript
        working-directory: v1
        run: npm run build

      - name: Verify external audit manifest SHA-256 parity
        working-directory: v1
        run: npm run audit:verify

      - name: Run full V1 test suite (SigmaState 6.0.2 JVM matrix, 24 ErgoScript mutations, HTTP+mTLS ceremony, Web/Metrics, codecs & DB)
        working-directory: v1
        env:
          BRIDGE_SIGMA_JARS_DIR: ${{ github.workspace }}/v1/jvm/target/dependency
        run: npm test

      - name: Build and smoke-test V1 Docker container (precompiled JVM + non-root runtime)
        run: |
          docker build -f v1/Dockerfile -t ergo-bridge-v1-ci .
          docker run --rm ergo-bridge-v1-ci --help | grep -q "signer-node"
          # Prove precompiled BridgeJvmTool.class + SigmaState 6.0.2 JARs execute cleanly under JRE-only (no javac!)
          docker run --rm --entrypoint ./node_modules/.bin/tsx ergo-bridge-v1-ci -e "
            import fs from 'node:fs';
            import { compileBridgeV1Family } from './src/core/contracts.ts';
            const f = JSON.parse(fs.readFileSync('./config.testnet.live.json', 'utf8')).family;
            const fam = compileBridgeV1Family({
              networkPrefix: f.networkPrefix,
              sourceNetworkIdHex: f.sourceNetworkIdHex,
              sidechainIdHex: f.sidechainIdHex,
              bridgeAddressHex: f.bridgeAddressHex,
              tokenAddressHex: f.tokenAddressHex,
              trackerNftIdHex: f.trackerNftIdHex,
              dupNftIdHex: f.dupNftIdHex,
              reserveNftIdHex: f.reserveNftIdHex,
              committeePubKeysHex: f.committeePubKeysHex,
              committeeThreshold: f.committeeThreshold,
              committeeEpoch: BigInt(f.committeeEpoch),
              escapeTimeoutBlocks: f.escapeTimeoutBlocks,
              minConfirmations: BigInt(f.minConfirmations),
              upgradeTimelockBlocks: BigInt(f.upgradeTimelockBlocks),
              maxAdmissionLagBlocks: BigInt(f.maxAdmissionLagBlocks),
              minDepositNanoErg: f.minDepositNanoErg ? BigInt(f.minDepositNanoErg) : undefined,
              minRefreshAgeBlocks: f.minRefreshAgeBlocks,
            });
            if (fam.familyIdHex !== '8e839ab9614f2c6611d5d430b08f63b522c847ba6ab550e50f6f0bd6675803ca' || fam.reserve.ergoTreeHex.length < 100) {
              throw new Error('Unexpected family compilation result in JRE container');
            }
            console.log('Docker JRE-only SigmaState 6.0.2 compilation verified OK:', fam.familyIdHex);
          "
