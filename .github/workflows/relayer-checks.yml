name: Bridge public-audit candidate checks

on:
  pull_request:
    paths:
      - ".github/workflows/relayer-checks.yml"
      - ".gitattributes"
      - ".gitignore"
      - ".gitmodules"
      - "README.md"
      - "docs/**"
      - "phases/**"
      - "contracts/**"
      - "relayer/**"
      - "scripts/**"
      - "solidity/**"
      - "sources/**"
      - "validity-proof/**"
      - "wasm-avl/**"
      - "substrate-node"
  push:
    branches:
      - main
      - master
      - "a-shannon/research-alpha"
    paths:
      - ".github/workflows/relayer-checks.yml"
      - ".gitattributes"
      - ".gitignore"
      - ".gitmodules"
      - "README.md"
      - "docs/**"
      - "phases/**"
      - "contracts/**"
      - "relayer/**"
      - "scripts/**"
      - "solidity/**"
      - "sources/**"
      - "validity-proof/**"
      - "wasm-avl/**"
      - "substrate-node"

permissions:
  contents: read

jobs:
  audit-alpha:
    name: Public-audit candidate gate
    runs-on: windows-latest
    # The full serial suite includes fresh process-custody provisioning matrices.
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
        working-directory: relayer

    steps:
      - name: Checkout recursive source graph
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Isolate audit Node.js
        working-directory: .
        run: |
          $sourceNode = (Get-Command node.exe -ErrorAction Stop).Source
          $sourceNodeDirectory = Split-Path -Parent $sourceNode
          $auditDirectory = Join-Path $env:RUNNER_TEMP "bridge-audit-node-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path (Join-Path $auditDirectory 'node_modules') | Out-Null
          Copy-Item -LiteralPath $sourceNode -Destination (Join-Path $auditDirectory 'node.exe')
          Copy-Item -LiteralPath (Join-Path $sourceNodeDirectory 'node_modules\npm') `
            -Destination (Join-Path $auditDirectory 'node_modules\npm') -Recurse
          $npmrcOverlay = Join-Path $auditDirectory 'node_modules\npm\npmrc'
          if (Test-Path -LiteralPath $npmrcOverlay) {
            $npmrcItem = Get-Item -LiteralPath $npmrcOverlay -Force
            if ($npmrcItem.PSIsContainer -or (($npmrcItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) {
              throw 'unexpected npmrc overlay type in hosted Node toolcache'
            }
            $npmrcText = [IO.File]::ReadAllText($npmrcOverlay)
            if ($npmrcText -notmatch '\Aprefix=\$\{APPDATA\}\\npm(?:\r?\n)?\z') {
              throw 'unexpected npmrc overlay content in hosted Node toolcache'
            }
            Remove-Item -LiteralPath $npmrcOverlay -Force
          }
          $auditNode = Join-Path $auditDirectory 'node.exe'
          $auditNpmPackage = Join-Path $auditDirectory 'node_modules\npm'
          $auditNpmCli = Join-Path $auditNpmPackage 'bin\npm-cli.js'
          $nodeLock = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'sources\authenticated-v2-runtime-bundle-build-lock-v2.json') -Raw | ConvertFrom-Json
          $npmLock = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'sources\clean-checkout-npm-lock-v1.json') -Raw | ConvertFrom-Json
          if ($nodeLock.schema -ne 'e2s.authenticated-v2-runtime-bundle-build-lock.v2' -or
              $nodeLock.platform -ne 'win32-x64' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'hosted audit Node platform does not match its lock'
          }
          $nodeItem = Get-Item -LiteralPath $auditNode -Force
          if (-not $nodeItem.PSIsContainer -and (($nodeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0)) {
            $nodeSha256 = (Get-FileHash -LiteralPath $auditNode -Algorithm SHA256).Hash.ToLowerInvariant()
          } else {
            throw 'hosted audit Node must be a regular non-reparse file'
          }
          if ($nodeSha256 -ne $nodeLock.nodeExecutableSha256) {
            throw 'hosted audit Node executable does not match its lock'
          }
          $npmEntries = @(Get-ChildItem -LiteralPath $auditNpmPackage -Recurse -Force)
          if ($npmEntries.Count -eq 0) { throw 'hosted audit npm package is empty' }
          $npmRecords = [Collections.Generic.List[string]]::new()
          foreach ($entry in $npmEntries) {
            if (($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'hosted audit npm package must not contain reparse points'
            }
            if (-not $entry.PSIsContainer) {
              $relative = [IO.Path]::GetRelativePath($auditNpmPackage, $entry.FullName).Replace('\', '/')
              $sha256 = (Get-FileHash -LiteralPath $entry.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $npmRecords.Add("${relative}:${sha256}")
            }
          }
          $orderedRecords = $npmRecords.ToArray()
          [Array]::Sort($orderedRecords, [StringComparer]::Ordinal)
          $npmPackageBytes = [Text.Encoding]::UTF8.GetBytes($orderedRecords -join "`n")
          $npmPackageSha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($npmPackageBytes)).ToLowerInvariant()
          if ($npmLock.schema -ne 'e2s.clean-checkout-npm-lock.v1' -or
              $npmLock.npmCliRelativePath -ne 'node_modules/npm/bin/npm-cli.js' -or
              $npmPackageSha256 -ne $npmLock.npmPackageSha256) {
            throw 'hosted audit npm package does not match its lock'
          }
          $npmCliItem = Get-Item -LiteralPath $auditNpmCli -Force
          if ($npmCliItem.PSIsContainer -or (($npmCliItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) {
            throw 'hosted audit npm CLI must be a regular non-reparse file'
          }
          $observedNodeVersion = (& $auditNode --version).Trim()
          $observedNpmVersion = (& $auditNode $auditNpmCli --version).Trim()
          if ($observedNodeVersion -ne "v$($nodeLock.nodeVersion)" -or
              $observedNpmVersion -ne $npmLock.npmVersion) {
            throw 'hosted audit Node or npm version does not match its lock'
          }
          "BRIDGE_AUDIT_NODE_DIRECTORY=$auditDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BRIDGE_AUDIT_NODE_EXECUTABLE=$auditNode" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BRIDGE_AUDIT_NPM_CLI=$auditNpmCli" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17.0.19+10"

      - name: Setup Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Provision wasm-bindgen 0.2.120
        working-directory: .
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "wasm-bindgen-0.2.120-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          $archive = Join-Path $toolRoot 'wasm-bindgen-0.2.120-x86_64-pc-windows-msvc.tar.gz'
          Invoke-WebRequest `
            -Uri 'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.120/wasm-bindgen-0.2.120-x86_64-pc-windows-msvc.tar.gz' `
            -OutFile $archive `
            -TimeoutSec 300
          $archiveSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveSha256 -ne 'd8ebacbfdbee70ffdcda0bbfefd99a645aee35ba31ba77dfa3b083f031674977') {
            throw 'wasm-bindgen 0.2.120 release archive does not match its reviewed SHA-256'
          }
          $member = 'wasm-bindgen-0.2.120-x86_64-pc-windows-msvc/wasm-bindgen.exe'
          tar -xzf $archive -C $toolRoot $member
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = Join-Path $toolRoot $member
          $executableSha256 = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($executableSha256 -ne '9d669c8c13bb70a37c8518c9476f9b716c7fdf463daaa73742dffb486e7f802a') {
            throw 'wasm-bindgen 0.2.120 executable does not match its reviewed SHA-256'
          }
          "WASM_BINDGEN_EXECUTABLE=$executable" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch locked WASM AVL dependencies
        working-directory: wasm-avl
        run: cargo fetch --locked

      - name: Install wasm-pack 0.14.0
        working-directory: .
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "wasm-pack-0.14.0-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          $archive = Join-Path $toolRoot 'wasm-pack-v0.14.0-x86_64-pc-windows-msvc.tar.gz'
          Invoke-WebRequest `
            -Uri 'https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.14.0/wasm-pack-v0.14.0-x86_64-pc-windows-msvc.tar.gz' `
            -OutFile $archive `
            -TimeoutSec 300
          $archiveSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveSha256 -ne 'd484c8e8bcd9e8c30097fbac78b52dd159598f99d11e43a50f5d143b67c721f1') {
            throw 'wasm-pack 0.14.0 release archive does not match its reviewed SHA-256'
          }
          $member = 'wasm-pack-v0.14.0-x86_64-pc-windows-msvc/wasm-pack.exe'
          tar -xzf $archive -C $toolRoot $member
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = Join-Path $toolRoot $member
          $executableSha256 = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($executableSha256 -ne '6e569a9bea962dbdc3e30e9aef076b1d559f7819b1cbb7ffce85ece8a7e47da8') {
            throw 'wasm-pack 0.14.0 executable does not match its reviewed SHA-256'
          }
          $version = (& $executable --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ne 'wasm-pack 0.14.0') {
            throw 'wasm-pack version does not match its reviewed version'
          }
          (Split-Path -Parent $executable) |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install relayer dependencies
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:Path = "$env:BRIDGE_AUDIT_NODE_DIRECTORY;$env:Path"
          & $env:BRIDGE_AUDIT_NODE_EXECUTABLE $env:BRIDGE_AUDIT_NPM_CLI ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check stopped-node recovery fixtures before long audit gate
        run: |
          $env:Path = "$env:BRIDGE_AUDIT_NODE_DIRECTORY;$env:Path"
          & $env:BRIDGE_AUDIT_NODE_EXECUTABLE $env:BRIDGE_AUDIT_NPM_CLI run wasm:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BRIDGE_AUDIT_NODE_EXECUTABLE ./node_modules/vitest/vitest.mjs run `
            src/substrate-federated-two-cycle-node-state-copy-v1.test.ts `
            src/substrate-federated-two-cycle-recovery-capture-v1.test.ts `
            src/substrate-federated-two-cycle-recovery-export-v1.test.ts --reporter=dot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup compiler Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Capture compiler Node.js
        run: |
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          "BRIDGE_COMPILER_NODE_EXECUTABLE=$node" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run public-audit candidate gate
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:Path = "$env:BRIDGE_AUDIT_NODE_DIRECTORY;$env:Path"
          & $env:BRIDGE_AUDIT_NODE_EXECUTABLE $env:BRIDGE_AUDIT_NPM_CLI run audit:alpha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  solidity-audit:
    name: Audit Solidity dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout dependency lock
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: solidity/package-lock.json

      - name: Install Solidity dependencies
        working-directory: solidity
        run: npm ci --ignore-scripts --include=dev

      - name: Audit Solidity dependencies
        working-directory: solidity
        run: |
          status=1
          for attempt in 1 2 3; do
            if npm audit --audit-level=high --registry=https://registry.npmjs.org/ --include=dev --include=optional --include=peer --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000 --fetch-timeout=30000; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "npm audit attempt ${attempt} failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          exit "$status"

  consensus-sources:
    name: Rebuild pinned Frontier and Ergo sources
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout recursive source graph
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            relayer/package-lock.json
            solidity/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Install Frontier native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev cmake protobuf-compiler

      - name: Install relayer dependencies
        working-directory: relayer
        run: npm ci

      - name: Verify reproducible Solidity build closure
        working-directory: solidity
        run: |
          npm ci --ignore-scripts --include=dev
          npm run check

      - name: Verify standalone consensus workflow
        working-directory: relayer
        run: npm run sources:verify:workflow

      - name: Verify tracked source lock
        working-directory: relayer
        run: npm run sources:verify:lock

      - name: Validate Frontier bridge event root vector
        working-directory: relayer
        run: npm run frontier:bridge-event-root:validate

      - name: Assemble finalized bridge checkpoint candidate vector
        working-directory: relayer
        run: npm run checkpoint:finalized:candidate

      - name: Apply tracked Frontier runtime commitment patch
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/sources/frontier/0001-bridge-runtime-commitment.patch"
          git -C substrate-node apply --check --unidiff-zero --whitespace=error-all "$patch"
          git -C substrate-node apply --unidiff-zero --whitespace=error-all "$patch"

      - name: Prepare pinned patched Ergo source
        shell: bash
        run: |
          set -euo pipefail
          source_dir=".source-cache/ergo-node"
          mkdir -p "$source_dir"
          git -C "$source_dir" init
          git -C "$source_dir" remote add origin https://github.com/ergoplatform/ergo.git
          git -C "$source_dir" fetch --depth=1 origin refs/tags/v6.0.2
          git -C "$source_dir" checkout --detach 2cdbb8cf09d7ccbc060e1022e3c15bcf6a9991b1
          git -C "$source_dir" apply --unidiff-zero "$GITHUB_WORKSPACE/sources/ergo-node/0002-sidechain-extension-fields-candidate-recovery.patch"

      - name: Verify complete source checkouts
        working-directory: relayer
        run: npm run sources:verify -- --ergo-source ../.source-cache/ergo-node

      - name: Test federated LAB no-value reservation admission
        working-directory: relayer
        run: npm run federated:lab:reservation:acceptance -- --frontier-source ../substrate-node

      - name: Test Frontier bridge commitment producer
        working-directory: substrate-node
        env:
          WASM_BUILD_WORKSPACE_HINT: ${{ github.workspace }}/substrate-node
        run: cargo test --locked -p frontier-template-runtime bridge_commitment

      - name: Test native GRANDPA finality proof verifier
        working-directory: substrate-node
        run: cargo test --locked -p bridge-finality-proof

      - name: Test native finalized bridge state proof verifier
        working-directory: substrate-node
        run: cargo test --locked -p bridge-state-proof

      - name: Test native finalized checkpoint verifier
        working-directory: substrate-node
        run: cargo test --locked -p bridge-checkpoint-verifier

      - name: Build native checkpoint cross-language executables
        working-directory: substrate-node
        run: >-
          cargo build --locked -p bridge-checkpoint-verifier
          --bin bridge-checkpoint-verifier
          --bin bridge-rpc-proof-codec

      - name: Verify native finalized checkpoint cross-language vector
        working-directory: relayer
        run: |
          npm run checkpoint:finalized:native:verify -- \
            --supplied-verifier "$GITHUB_WORKSPACE/substrate-node/target/debug/bridge-checkpoint-verifier" \
            --supplied-codec "$GITHUB_WORKSPACE/substrate-node/target/debug/bridge-rpc-proof-codec"

      - name: Build patched Frontier template node
        working-directory: substrate-node
        env:
          WASM_BUILD_WORKSPACE_HINT: ${{ github.workspace }}/substrate-node
        run: cargo build --locked --release -p frontier-template-node

      - name: Test Ergo extension producer patch
        working-directory: .source-cache/ergo-node
        run: sbt "testOnly org.ergoplatform.mining.CandidateGeneratorSpec"

      - name: Build patched Ergo node
        working-directory: .source-cache/ergo-node
        run: sbt assembly

      - name: Recheck source identity after builds
        working-directory: relayer
        run: npm run sources:verify -- --ergo-source ../.source-cache/ergo-node
